name: 주간 벌금 점검

on:
  schedule:
    # GitHub Actions cron은 UTC 기준: 월요일 00:00 KST = 일요일 15:00 UTC
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fines:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: 주간 벌금 계산 및 README 갱신
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_fines.py
      - name: 변경사항 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/fines-state.json
          git diff --cached --quiet || git commit -m 'chore: 주간 벌금 현황 갱신'
          git push
